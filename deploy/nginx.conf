server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    types {
        application/wasm wasm;
        application/manifest+json webmanifest;
    }
    include /etc/nginx/mime.types;

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml application/manifest+json;

    # PWA の更新が届くよう、エントリと Service Worker はキャッシュさせない
    location ~ ^/(index\.html|sw\.js|registerSW\.js|manifest\.webmanifest|app\.webmanifest)$ {
        add_header Cache-Control "no-cache";
    }

    # ファイル名にハッシュが付く
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Room API (server/). Resolved at request time through Docker's DNS, so
    # nginx still starts when the API container is not running.
    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $api http://mahjong-calc-api:8787;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        # Server-sent events
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
