server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    types {
        application/wasm wasm;
        application/manifest+json webmanifest;
    }
    include /etc/nginx/mime.types;

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm image/svg+xml application/manifest+json;

    # PWA の更新が届くよう、エントリと Service Worker はキャッシュさせない
    location ~ ^/(index\.html|sw\.js|registerSW\.js|manifest\.webmanifest|app\.webmanifest)$ {
        add_header Cache-Control "no-cache";
    }

    # ファイル名にハッシュが付く
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
