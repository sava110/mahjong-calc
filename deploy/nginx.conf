# web 版の配信は終了し、iOS アプリ（live-mahjong）が使う対局ルーム API だけを中継する。
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    include /etc/nginx/mime.types;

    gzip on;
    gzip_types application/json;

    # Room API (server/). Resolved at request time through Docker's DNS, so
    # nginx still starts when the API container is not running.
    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $api http://mahjong-calc-api:8787;
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        # Server-sent events
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 1h;
        add_header Cache-Control "no-store";
    }

    # インストール済みの PWA を取り除く Service Worker。更新が必ず届くようにキャッシュさせない
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # それ以外はすべて終了のお知らせ
    location / {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }
}
